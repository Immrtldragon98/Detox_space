services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: detox_space
      POSTGRES_USER: detox
      POSTGRES_PASSWORD: detox
    ports:
      - "5432:5432"
    volumes:
      - detox_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U detox -d detox_space"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  detox_postgres:
