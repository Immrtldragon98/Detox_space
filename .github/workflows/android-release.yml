name: Publish Signed Android Test Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub release tag, for example v0.6.1-test.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify release secrets are configured
        env:
          KEYSTORE_BASE64: ${{ secrets.DETOX_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DETOX_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DETOX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DETOX_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.DETOX_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/detox-release.jks"
      - name: Test, lint, and build signed Android artifacts
        env:
          DETOX_KEYSTORE_PATH: ${{ runner.temp }}/detox-release.jks
          DETOX_KEYSTORE_PASSWORD: ${{ secrets.DETOX_KEYSTORE_PASSWORD }}
          DETOX_KEY_ALIAS: ${{ secrets.DETOX_KEY_ALIAS }}
          DETOX_KEY_PASSWORD: ${{ secrets.DETOX_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease bundleRelease --stacktrace
      - name: Name release files and create checksums
        run: |
          cp app/build/outputs/apk/release/app-release.apk "Detox-Space-${{ inputs.release_tag }}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "Detox-Space-${{ inputs.release_tag }}.aab"
          sha256sum "Detox-Space-${{ inputs.release_tag }}.apk" "Detox-Space-${{ inputs.release_tag }}.aab" > "Detox-Space-${{ inputs.release_tag }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: detox-space-signed-test-release
          path: |
            Detox-Space-${{ inputs.release_tag }}.apk
            Detox-Space-${{ inputs.release_tag }}.aab
            Detox-Space-${{ inputs.release_tag }}.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Publish signed GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          name: "Detox Space ${{ inputs.release_tag }} signed test"
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: |
            Detox-Space-${{ inputs.release_tag }}.apk
            Detox-Space-${{ inputs.release_tag }}.aab
            Detox-Space-${{ inputs.release_tag }}.sha256
