name: Android Signed Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.DETOX_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/detox-release.jks"
      - name: Test and build signed bundle
        env:
          DETOX_KEYSTORE_PATH: ${{ runner.temp }}/detox-release.jks
          DETOX_KEYSTORE_PASSWORD: ${{ secrets.DETOX_KEYSTORE_PASSWORD }}
          DETOX_KEY_ALIAS: ${{ secrets.DETOX_KEY_ALIAS }}
          DETOX_KEY_PASSWORD: ${{ secrets.DETOX_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest bundleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: detox-space-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
